[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
gas_reports = ['*']
solc_version = "0.8.34"
optimizer = true
optimizer_runs = 2995
ffi = true
ast = true
build_info = true
dynamic_test_linking = false
fs_permissions = [{ access = "read-write", path = "." }]

[profile.deploy]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 2800

[profile.solx]
gas_limit = 100_000_000

[lint]
exclude_lints = [
    "mixed-case-function",
    "screaming-snake-case-immutable",
    "pascal-case-struct", 
    "mixed-case-variable",
    "unsafe-cheatcode",
    "unsafe-typecast",
    "erc20-unchecked-transfer"
]
                    
[fuzz]
runs = 1000
max_test_rejects = 65536
dictionary_weight = 40
include_storage = true
include_push_bytes = true

[invariant]
runs = 256
depth = 128
fail_on_revert = true
call_override = false

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 120
multiline_func_header = "all"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
sort_imports = true
ignore = ["src/vendor/**"]

[rpc_endpoints]
mainnet = "${RPC_MAINNET}"
sepolia = "${RPC_SEPOLIA}"

[etherscan]
mainnet = { key = "${ETHERSCAN_MAINNET_KEY}" }
sepolia = { key = "${ETHERSCAN_SEPOLIA_KEY}" }

[doc]
out = "foundry-docs/"
title = "KAM Contracts Documentation"
ignore = [
    "src/vendor/**",
]

[dependencies]
forge-std = "1.9.7"
minimal-smart-account = { version = "1.0", git = "https://github.com/turingcapitalgroup/minimal-smart-account.git", rev = "0fd060740a7d929b56cff6f73350a19179612ac4" }
kToken0 = { version = "1.0", git = "https://github.com/turingcapitalgroup/kToken0.git", rev = "aae48d11131458e57b43e6e54b20e1cf534c63d3" }
minimal-uups-factory = { version = "1.0", git = "https://github.com/turingcapitalgroup/minimal-uups-factory", rev = "568d85a0921f5b0bc7c410d99363cebdd0cd2ee5" }

[soldeer]
# whether soldeer manages remappings
remappings_generated = false
# whether soldeer re-generates all remappings when installing, updating or uninstalling deps
remappings_regenerate = false
# whether to suffix the remapping with the version: `name-a.b.c`
remappings_version = false
